[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prospectai"
version = "1.11.0"
description = "Multi-Agent Investment Analysis System powered by CrewAI and Claude"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "moisesprat" }]
requires-python = ">=3.9"
keywords = ["investment", "ai", "crewai", "stock-analysis", "multi-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "crewai>=1.12,<2",
    "crewai-tools>=1.12,<2",
    "python-dotenv>=1.1,<2",
    "pandas>=3.1,<4",
    "numpy>=2.4,<3",
    "requests>=2.32,<3",
    "yfinance>=1.7,<2",
    "PyYAML>=6.0,<7",
    "ta>=0.11,<0.12",
    # MUST match crewai's own anthropic extra (crewai 1.12.2 declares anthropic~=0.73.0).
    # crewai's Anthropic provider passes `temperature`, which anthropic 2.x removed from
    # messages.create; 1.9.3 shipped with 2.3.0 and every run failed (hotfix 1.9.4).
    # Bump this only together with crewai (see tests/test_llm_sdk_compat.py).
    "anthropic>=0.73,<0.74",
    "praw>=7.8,<8",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "pytest-asyncio>=1.4,<2", "pytest-cov>=7.1,<8", "pytest-socket>=0.8,<0.9"]
# Declared, not removed: dropping these is DEBT-02 (Phase 5).
legacy = ["portkey-ai>=2.3,<3", "plotly>=5.17,<6", "reportlab>=5.1,<6"]

[project.scripts]
prospectai = "main:main"

# Root-level modules (main.py, prospect_ai_crew.py, prospect_ai_flow.py)
[tool.setuptools]
py-modules = ["main", "prospect_ai_crew", "prospect_ai_flow"]

# Subpackages — explicitly scoped to avoid picking up .venv or test noise
[tool.setuptools.packages.find]
include = ["agents*", "config*", "utils*", "data*", "schemas*"]

# Include the YAML agent configs bundled inside the config package
[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --no-header -p no:warnings"

[tool.coverage.run]
omit = ["tests/*", ".venv/*", "setup.py"]

[tool.coverage.report]
show_missing = true
