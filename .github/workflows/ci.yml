# ProspectAI CI gate (TEST-05, DEPL-04).
#
# - The suite runs fully offline: sockets are blocked (pytest-socket) and no
#   API keys or secrets are referenced. A test that reaches the network fails
#   loudly with SocketBlockedError instead of flaking.
# - The job id `test` is the branch-protection required-check context. Keep it
#   the only job in this file so no unrelated job can satisfy the requirement.
# - Do NOT add `paths:` filters to the triggers: a skipped workflow leaves a
#   required check pending forever.
# - requirements.txt is generated by `bash scripts/lock.sh` from pyproject.toml
#   plus constraints.txt. Never hand-edit it; the "Lock is current" step
#   regenerates it and fails the job on any diff.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CREWAI_TRACING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      # astral-sh/setup-uv v10.3.2, pinned by commit SHA (third-party action).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Create venv (Python 3.11, matches Modal and Docker)
        run: uv venv --clear --python 3.11 .venv

      - name: Install the locked dependencies
        run: uv pip sync --python .venv/bin/python requirements.txt

      - name: Lock is current
        run: |
          bash scripts/lock.sh
          git diff --exit-code -- requirements.txt

      - name: Offline test suite
        run: .venv/bin/python -m pytest --disable-socket --allow-unix-socket
